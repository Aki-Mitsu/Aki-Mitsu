name: Generate Snake

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:       # lets you run it manually
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-v2.svg?color_dots=#161b22,#ff3b3b,#ff3b3b,#ff3b3b,#ff3b3b&color_snake=#ffffff&color_dot_border=#0d1117

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
